services:
  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # bootstrap 및 내부 접근용 (tailnet 전용). 일반 push/pull 은 registry.internal 사용.
      - "${OPS_TAILNET_IP}:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

volumes:
  registry-data:

networks:
  nexus:
    external: true
