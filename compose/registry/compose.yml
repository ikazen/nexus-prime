services:
  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # tailnet 내부 only. 공인 노출 X (이미지에 lol-list 등 private 코드 포함 가능).
      - "${OPS_TAILNET_IP}:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

volumes:
  registry-data:

networks:
  nexus:
    external: true
