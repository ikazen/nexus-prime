# omnigent 러너(host) provider 설정. /root/.omnigent/config.yaml 로 마운트된다
# (host 컨테이너는 root 로 실행). 실제 API key 는 담지 않는다 — env 참조만
# (docs/decisions.md L14 placeholder 정책, 커밋 가능).
#
# 하니스 자체 인증(Anthropic/OpenAI)은 여기가 아니라 compose.yml 의
# OMNIGENT_ANTHROPIC_API_KEY / OPENAI_API_KEY env 로 주입된다. 여기는 vendor 가
# 직접 지원하지 않는 provider(Ollama Cloud, OpenAI 호환 게이트웨이) 추가용.
providers:
  ollama-cloud:
    kind: gateway
    default: openai
    openai:
      base_url: https://ollama.com/v1
      api_key_ref: env:OLLAMA_API_KEY
      wire_api: chat
