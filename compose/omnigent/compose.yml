services:
  omnigent:
    image: ghcr.io/omnigent-ai/omnigent-server:${OMNIGENT_TAG:-latest}
    container_name: omnigent
    environment:
      # postgres = ops-vm, tailnet IP 직결(nexus network 없는 worker-vm 배치, L23).
      # cross-DB 읽기는 omnigent_ro role 로 별도 발급 (dev-guide "Postgres read-only role 발급").
      DATABASE_URL: postgresql+psycopg://${OMNIGENT_PG_USER}:${OMNIGENT_PG_PASSWORD}@${OPS_TAILNET_IP}:5432/${OMNIGENT_PG_DB}
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      # single-user 모드 — self-managed host 의 WS 터널이 accounts 모드에서 403 되어 비활성화 (L25)
      OMNIGENT_AUTH_ENABLED: "0"
      # single-user 모드는 multipart 엔드포인트(세션 생성 등)를 Origin=loopback 에만 허용(CSRF 방지) —
      # Caddy 경유 agent.internal 은 loopback 이 아니라 명시 allowlist 필요. 스킴 포함 정확히 일치, 와일드카드 미지원 (L25)
      OMNIGENT_WS_ALLOWED_ORIGINS: "http://agent.internal"
    volumes:
      - omnigent-data:/data
    # tailnet 인터페이스에만 바인드 — ops-vm Caddy 가 agent.internal 로 여기까지 reverse_proxy (L23)
    ports:
      - "${WORKER_TAILNET_IP}:8000:8000"
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8000))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 실제 harness(claude-native/codex/opencode) 실행 러너 — omnigent-server 는 control-plane
  # 뿐이라 harness 를 실행하지 않는다(vendor 아키텍처, L25). WS 터널로 서버가 배정하는 세션을 실행.
  omnigent-host:
    image: registry.internal:5000/omnigent-host:${OMNIGENT_HOST_TAG:-latest}
    container_name: omnigent-host
    # opencode.json 의 apiKey 는 {env:VAR} 가 custom provider 에서 동작하지 않는 vendor 버그로
    # {file:...} 참조 — env 를 파일로 물질화하는 wrapper 필요 (L28)
    command:
      - sh
      - -c
      - |
        mkdir -p /root/.secrets
        printf '%s' "$$OLLAMA_API_KEY" > /root/.secrets/ollama_api_key
        chmod 600 /root/.secrets/ollama_api_key
        exec omnigent host --server http://omnigent:8000
    depends_on:
      omnigent:
        condition: service_healthy
    environment:
      # 하니스 인증 = 웹 구독, API 키 아님 (L26). Claude: `claude setup-token` 으로 만든 토큰.
      # ANTHROPIC_API_KEY 와 동시 설정 금지 — raw API 키가 우선 인식되어 종량 과금으로 갈 수 있음.
      # Codex: 개인 Plus/Pro 는 헤드리스 토큰 없음 — 배포 후 `docker exec -it omnigent-host
      # codex login --device-auth` 로 컨테이너 안에서 직접 로그인, 결과는 아래 볼륨에 영속.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # Ollama Cloud provider 인증 (L28) — wrapper 가 파일로 물질화, opencode.json 이 {file:...} 로 참조
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      # git-worker 전용(agents/git-worker/), 값은 이 컨테이너(parent 프로세스)에만 존재:
      #   - OMNIGENT_GH_TOKEN: fine-grained PAT, credential_proxy(gh_basic) 가 github.com
      #     아웃바운드에만 주입 — 샌드박스는 합성 placeholder 만 봄
      #   - OMNIGENT_RONDO_RO_URL / OMNIGENT_POG_RO_URL: omnigent_ro role DSN, local tool 이
      #     parent 프로세스에서 직접 읽음(egress_rules 는 HTTP(S) 전용이라 Postgres TCP 는 못 나감)
      OMNIGENT_GH_TOKEN: ${OMNIGENT_GH_TOKEN}
      OMNIGENT_RONDO_RO_URL: ${OMNIGENT_RONDO_RO_URL}
      OMNIGENT_POG_RO_URL: ${OMNIGENT_POG_RO_URL}
    volumes:
      # OpenCode 자체 provider 설정 — omnigent 의 provider 설정과 무관, 독립 관리(L27/L28)
      - ./host/opencode.json:/root/.config/opencode/opencode.json:ro
      - omnigent-host-workspace:/data/workspace
      - omnigent-host-codex-auth:/root/.codex
      - omnigent-host-secrets:/root/.secrets
    restart: unless-stopped
    mem_limit: 4g

volumes:
  omnigent-data:
  omnigent-host-workspace:
  omnigent-host-codex-auth:
  omnigent-host-secrets:
