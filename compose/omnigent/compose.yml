services:
  omnigent:
    image: ghcr.io/omnigent-ai/omnigent-server:${OMNIGENT_TAG:-latest}
    container_name: omnigent
    environment:
      DATABASE_URL: postgresql+psycopg://${OMNIGENT_PG_USER}:${OMNIGENT_PG_PASSWORD}@postgres:5432/${OMNIGENT_PG_DB}
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      # 인증: built-in accounts 모드 (OIDC 아님). 공개 RCE 표면 + 개인 계정 단독 사용
      # 기준, Google OIDC의 allowed_domains는 도메인 전체를 허용해 실질 게이트가 안 됨
      # (BON-262). AUTH_ENABLED=1 + OIDC issuer 미설정 = accounts 모드 자동 선택.
      OMNIGENT_AUTH_ENABLED: "1"
      OMNIGENT_ACCOUNTS_BASE_URL: https://${OMNIGENT_DOMAIN}
      OMNIGENT_ACCOUNTS_COOKIE_SECRET: ${OMNIGENT_ACCOUNTS_COOKIE_SECRET}
      OMNIGENT_ACCOUNTS_AUTO_OPEN: "0"
      # 에이전트 CLI 자격증명 — 하니스가 컨테이너 안에서 실행되므로 env로 주입
      OMNIGENT_ANTHROPIC_API_KEY: ${OMNIGENT_ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - omnigent-data:/data
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8000))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nexus

volumes:
  omnigent-data:

networks:
  nexus:
    external: true
