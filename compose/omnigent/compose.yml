services:
  omnigent:
    image: ghcr.io/omnigent-ai/omnigent-server:${OMNIGENT_TAG:-latest}
    container_name: omnigent
    environment:
      # postgres 는 ops-vm 호스트 (nexus network 없는 worker-vm 배치, L23) — tailnet IP 직결.
      # omnigent user = 자기 DB(omnigent) 만 read-write. cross-DB 읽기는 omnigent_ro role
      # 로 별도 발급 (dev-guide "Postgres read-only role 발급").
      DATABASE_URL: postgresql+psycopg://${OMNIGENT_PG_USER}:${OMNIGENT_PG_PASSWORD}@${OPS_TAILNET_IP}:5432/${OMNIGENT_PG_DB}
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      # 인증: single-user 모드 (L25). 이 서버는 harness 를 실행하지 않는 control-plane
      # 뿐이고(vendor 아키텍처 — 실제 실행은 omnigent-host 러너), self-managed host 의
      # WS 터널(/v1/runner/tunnel) 이 accounts 모드에서는 403 으로 거부되어 비활성화했다.
      # L22/L23 이 accounts 를 "심층방어"로 유지하기로 한 것과 충돌하지만, self-managed
      # host 를 쓰기로 한 시점에 감수하기로 한 트레이드오프 — 주 방어선은 tailnet 전용
      # 노출(L23, WORKER_TAILNET_IP 바인드 + agent.internal)이다.
      OMNIGENT_AUTH_ENABLED: "0"
    volumes:
      - omnigent-data:/data
    # tailnet 인터페이스에만 바인드 — ops-vm Caddy 가 agent.internal 로 여기까지 reverse_proxy (L23)
    ports:
      - "${WORKER_TAILNET_IP}:8000:8000"
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8000))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 실제 harness(claude-native/codex/opencode) 실행 러너. omnigent-server 는 control-plane
  # 전용이라 harness 를 절대 실행하지 않는다(vendor 아키텍처, L25) — 이 컨테이너가
  # `omnigent host --server http://omnigent:8000` 로 WS 터널을 열어 서버가 배정하는
  # 세션을 실행한다. 커스텀 이미지 = vendor omnigent-host + opencode(vendor 이미지엔
  # claude-code/codex/pi/kiro 는 있지만 opencode 는 없음) — compose/omnigent/host/Dockerfile.
  omnigent-host:
    image: registry.internal:5000/omnigent-host:${OMNIGENT_HOST_TAG:-latest}
    container_name: omnigent-host
    command: ["omnigent", "host", "--server", "http://omnigent:8000"]
    depends_on:
      omnigent:
        condition: service_healthy
    environment:
      # 하니스 인증 — 웹 구독 사용(API 키 아님, L26). 실제로 이 컨테이너에서 하니스가
      # 실행되므로 여기(server 아님).
      #   - Claude: `claude setup-token`(로컬 1회 브라우저 인증)으로 만든 장기 토큰을
      #     CLAUDE_CODE_OAUTH_TOKEN 으로 주입 — 컨테이너 안에서 로그인 불필요, portable.
      #     ANTHROPIC_API_KEY/OMNIGENT_ANTHROPIC_API_KEY 와 동시에 설정하지 말 것 —
      #     raw API 키가 우선 인식되어 구독 대신 종량 과금으로 갈 수 있음.
      #   - Codex: ChatGPT **개인 Plus/Pro** 플랜은 헤드리스 토큰이 없음(vendor 문서 —
      #     `~/.codex/auth.json` 이 사실상 1회용 refresh token이라 시크릿으로 주입 불가).
      #     대신 배포 후 1회 `docker exec -it omnigent-host codex login --device-auth`
      #     로 컨테이너 안에서 직접 로그인하고, 그 결과를 아래 볼륨(/root/.codex)으로
      #     영속시킨다 (ChatGPT → Settings → Security 에서 device-code login 선행 활성화
      #     필요). CODEX_ACCESS_TOKEN 은 Business/Enterprise 워크스페이스 전용이라 해당 없음.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # git-worker 에이전트(agents/git-worker/) 전용. 실제 값은 이 컨테이너(하니스가
      # 도는 러너의 parent 프로세스)에만 존재 — 샌드박스 안 에이전트로는 전달되지 않는다.
      #   - OMNIGENT_GH_TOKEN: fine-grained PAT. os_env.sandbox.credential_proxy
      #     (gh_basic) 가 이 env 를 읽어 github.com/api.github.com 아웃바운드에만
      #     실제 토큰을 주입한다 — 샌드박스는 합성 placeholder 만 봄.
      #   - OMNIGENT_RONDO_RO_URL / OMNIGENT_POG_RO_URL: omnigent_ro role
      #     (read-only, dev-guide "Postgres read-only role 발급") DSN. local tool
      #     (tools/python/query_*_readonly.py) 이 parent 프로세스에서 직접 읽는다 —
      #     os_env 샌드박스는 egress_rules 가 HTTP(S) 전용이라 어차피 Postgres TCP 를
      #     못 나간다.
      OMNIGENT_GH_TOKEN: ${OMNIGENT_GH_TOKEN}
      OMNIGENT_RONDO_RO_URL: ${OMNIGENT_RONDO_RO_URL}
      OMNIGENT_POG_RO_URL: ${OMNIGENT_POG_RO_URL}
    volumes:
      # OpenCode 자체 provider 설정(Ollama Cloud 사이드카 연결, L27). OpenCode 는 omnigent 의
      # provider 설정을 읽지 않고 자기 전역 config(~/.config/opencode/opencode.json, host 는
      # root 실행)를 따로 관리한다.
      - ./host/opencode.json:/root/.config/opencode/opencode.json:ro
      - omnigent-host-workspace:/data/workspace
      # Codex 개인 플랜 로그인 영속 — 위 주석 참조. `codex login` 이 여기 쓴다.
      - omnigent-host-codex-auth:/root/.codex
    restart: unless-stopped
    mem_limit: 4g

  # OpenCode 의 Ollama Cloud provider 가 가리키는 사이드카 (L27). omnigent-host 의 OpenCode 는
  # 자기 provider 설정을 따로 관리하고 omnigent 의 provider config.yaml 을 읽지 않으므로,
  # Ollama Cloud 연동은 omnigent 레이어가 아니라 이 sidecar + OpenCode 자체 config 로 한다.
  # 공식 ollama/ollama 이미지가 OLLAMA_API_KEY 로 :cloud 접미사 모델 요청을 ollama.com 으로
  # 프록시한다 — 로컬에 모델 가중치를 받지 않는다(디스크·VRAM 불필요).
  ollama:
    image: ollama/ollama:latest
    container_name: omnigent-ollama
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    volumes:
      - omnigent-ollama-data:/root/.ollama
    restart: unless-stopped
    mem_limit: 1g

volumes:
  omnigent-data:
  omnigent-host-workspace:
  omnigent-host-codex-auth:
  omnigent-ollama-data:
