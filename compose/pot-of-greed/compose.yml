services:
  pot-of-greed-api:
    image: registry.internal:5000/pot-of-greed:${POG_TAG:-latest}
    container_name: pot-of-greed-api
    environment:
      PG_DSN: postgresql://${POG_PG_USER}:${POG_PG_PASSWORD}@postgres:5432/${POG_PG_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      JWT_SECRET: ${POG_JWT_SECRET}
      AUTH_USERS: ${POG_AUTH_USERS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8000))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nexus

networks:
  nexus:
    external: true
