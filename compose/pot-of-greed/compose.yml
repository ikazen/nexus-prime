services:
  pot-of-greed-api:
    image: registry.internal:5000/pot-of-greed:${POG_TAG:-latest}
    container_name: pot-of-greed-api
    environment:
      PG_DSN: postgresql://${POG_PG_USER}:${POG_PG_PASSWORD}@postgres:5432/${POG_PG_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://${MAC_TAILNET_IP}:11434
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      LLM_PROVIDER: ${POG_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${POG_GEMINI_API_KEY}
      GEMINI_MODEL: ${POG_GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${POG_JWT_SECRET}
      AUTH_USERS: ${POG_AUTH_USERS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nexus

  pot-of-greed-ui:
    image: registry.internal:5000/pot-of-greed-ui:${POG_TAG:-latest}
    container_name: pot-of-greed-ui
    environment:
      API_BASE_URL: http://pot-of-greed-api:8000
      CHAINLIT_AUTH_SECRET: ${POG_CHAINLIT_AUTH_SECRET}
      CHAINLIT_DB_DSN: postgresql+asyncpg://${POG_PG_USER}:${POG_PG_PASSWORD}@postgres:5432/${POG_PG_DB}
    restart: unless-stopped
    networks:
      - nexus

networks:
  nexus:
    external: true
