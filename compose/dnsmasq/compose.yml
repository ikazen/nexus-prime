services:
  dnsmasq:
    # bootstrap chicken-and-egg 회피: build: . 로 첫 셋업에서 로컬 빌드, image tag 는 IP:5000 (DNS 미구축 단계)
    build: .
    image: ${OPS_TAILNET_IP}:5000/dnsmasq:latest
    container_name: dnsmasq
    network_mode: host
    command:
      - --address=/.internal/${OPS_TAILNET_IP}
      - --listen-address=${OPS_TAILNET_IP}
      - --listen-address=127.0.0.1
      - --listen-address=172.17.0.1
      - --bind-interfaces
      - --server=1.1.1.1
      - --server=8.8.8.8
      - --domain-needed
      - --bogus-priv
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "-p", "53", ".", "NS", "+short"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
