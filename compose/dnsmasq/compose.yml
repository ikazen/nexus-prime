services:
  dnsmasq:
    build: .
    # DNS 구축 전이라 registry.internal 미해석 — bootstrap 주소(IP:5000) 직접 태그
    # build: . 덕에 registry 없는 첫 셋업에서도 docker compose build 로 로컬 빌드 가능
    image: ${OPS_TAILNET_IP}:5000/dnsmasq:latest
    container_name: dnsmasq
    network_mode: host
    command:
      - --address=/.internal/${OPS_TAILNET_IP}
      - --listen-address=${OPS_TAILNET_IP}
      - --bind-interfaces
      - --server=1.1.1.1
      - --server=8.8.8.8
      - --domain-needed
      - --bogus-priv
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped
