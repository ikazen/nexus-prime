groups:
  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job=~"node_.*"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} node_exporter 응답 없음"

      - alert: ServiceDown
        expr: up{job="statsd"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 응답 없음"

      - alert: DiskSpaceLow
        expr: >
          node_filesystem_avail_bytes{mountpoint="/", job=~"node_ops_vm|node_worker_vm|node_mac_server"}
          / node_filesystem_size_bytes{mountpoint="/", job=~"node_ops_vm|node_worker_vm|node_mac_server"} < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 디스크 여유 20% 미만"

      - alert: MemoryLow
        expr: >
          node_memory_MemAvailable_bytes{job=~"node_ops_vm|node_worker_vm"}
          / node_memory_MemTotal_bytes{job=~"node_ops_vm|node_worker_vm"} < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 메모리 여유 10% 미만"

      - alert: MemoryLowMac
        expr: >
          (node_memory_free_bytes{job="node_mac_server"}
          + node_memory_inactive_bytes{job="node_mac_server"}
          + node_memory_purgeable_bytes{job="node_mac_server"})
          / node_memory_total_bytes{job="node_mac_server"} < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 메모리 여유 10% 미만"

  - name: airflow
    rules:
      # scheduler 가 heartbeat 를 멈춤 = 플랫폼 정지. 가장 치명적.
      - alert: SchedulerHeartbeatStopped
        expr: rate(airflow_scheduler_heartbeat[5m]) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "airflow scheduler heartbeat 중단 — 플랫폼 정지"

      # 손실 치명적인 일 1회 DAG. 잦은 sync_* 는 다음 발화가 흡수하므로 제외.
      - alert: DailyMetaDagFailed
        expr: increase(airflow_dagrun_duration_failed_count{dag_id="daily_meta"}[2h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "daily_meta DAG run 실패"

      # git push 로 깨진 DAG 배포 시 dag-processor 파싱 실패.
      - alert: DagImportError
        expr: airflow_dag_processing_import_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DAG import 에러 {{ $value }}건 (깨진 DAG 배포?)"

      # edge worker 오프라인은 호스트 레벨 NodeDown 이 커버 (mac 포함).
      # edge_worker.connected 는 api-server(uvicorn)가 statsd 미emit + 복구 시 1 미송신이라 알람 부적합.
