services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      AIRFLOW_DOMAIN: ${AIRFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  nexus:
    external: true
