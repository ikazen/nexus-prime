services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      AIRFLOW_DOMAIN: ${AIRFLOW_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      MAC_TAILNET_IP: ${MAC_TAILNET_IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  nexus:
    external: true
