services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      AIRFLOW_DOMAIN: ${AIRFLOW_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      MAC_TAILNET_IP: ${MAC_TAILNET_IP}
      WORKER_TAILNET_IP: ${WORKER_TAILNET_IP}
      POT_OF_GREED_DOMAIN: ${POT_OF_GREED_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    healthcheck:
      # localhost는 컨테이너에서 ::1(IPv6)로 우선 resolve되나 admin은 127.0.0.1만 리스닝.
      # 루트 /는 404 → /config/ 사용 (200)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  nexus:
    external: true
